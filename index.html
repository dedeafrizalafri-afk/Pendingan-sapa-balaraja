<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPA BALARAJA - Dashboard</title>
    <!-- Library Chart.js untuk grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f8fafc;
            margin: 0;
            padding: 15px;
            color: #1e293b;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .top-bar {
            background-color: #e11d48;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .top-bar h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }
        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .card-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 4px 0;
        }
        .card-subtitle {
            font-size: 13px;
            color: #64748b;
            margin: 0 0 15px 0;
        }
        .chart-container {
            position: relative;
            height: 280px;
            width: 100%;
        }
        .table-responsive {
            overflow-x: auto;
            margin-top: 10px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
        }
        th {
            background-color: #1e293b;
            color: #ffffff;
            padding: 10px 12px;
            white-space: nowrap;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            white-space: nowrap;
        }
        tr:nth-child(even) { background-color: #f8fafc; }
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }
        .pagination-controls button {
            background-color: #e11d48;
            color: white;
            border: none;
            padding: 6px 14px;
            margin-left: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .pagination-controls button:disabled {
            background-color: #cbd5e1;
            cursor: not-allowed;
        }
        #dataInfo {
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="top-bar">
        <h1>SAPA BALARAJA - Executive Operations System</h1>
    </div>

    <!-- Grafik Kategori Penanganan -->
    <div class="card">
        <h3 class="card-title">📊 Kategori Penanganan</h3>
        <p class="card-subtitle">Perbandingan kategori tindak lanjut order</p>
        <div class="chart-container">
            <canvas id="chartKategoriPenanganan"></canvas>
        </div>
    </div>

    <!-- Tabel Data Utama -->
    <div class="card">
        <h3 class="card-title">📋 Data Order</h3>
        <div class="table-responsive">
            <table id="dataTable">
                <thead></thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="pagination-container">
            <div id="dataInfo">Memuat data...</div>
            <div class="pagination-controls">
                <button id="btnPrev" onclick="changePage(state.currentPage - 1)">Sebelumnya</button>
                <button id="btnNext" onclick="changePage(state.currentPage + 1)">Selanjutnya</button>
            </div>
        </div>
    </div>

</div>

<script>
// 1. URL CSV Google Sheets (Gunakan link /pub?output=csv)
const URLS = {
    p: "https://docs.google.com/spreadsheets/d/e/2PACX-1v.../pub?output=csv"
};

// Indeks Kolom Kategori Penanganan di Spreadsheet (misal: 3 untuk Kolom D)
const INDEX_KATEGORI_PENANGANAN = 3;

// 2. State Aplikasi
let state = {
    allData: [],
    filteredData: [],
    currentPage: 1,
    pageSize: 50
};

let chartInstance = null;

// 3. Parser CSV Sempurna
function parseCSV(text) {
    const lines = [];
    let row = [];
    let inQuotes = false;
    let entry = '';

    for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const nextC = text[i + 1];

        if (c === '"') {
            if (inQuotes && nextC === '"') {
                entry += '"';
                i++;
            } else {
                inQuotes = !inQuotes;
            }
        } else if (c === ',' && !inQuotes) {
            row.push(entry.trim());
            entry = '';
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
            if (c === '\r' && nextC === '\n') { i++; }
            row.push(entry.trim());
            if (row.length > 0 && row.some(cell => cell !== '')) {
                lines.push(row);
            }
            row = [];
            entry = '';
        } else {
            entry += c;
        }
    }
    if (entry || row.length > 0) {
        row.push(entry.trim());
        lines.push(row);
    }
    return lines;
}

// 4. Memuat Seluruh 1700 Data Tanpa Menghapus Apapun dari Tabel
async function fetchAndRenderData() {
    try {
        const response = await fetch(URLS.p);
        const textData = await response.text();
        
        const parsedRows = parseCSV(textData);
        if (parsedRows.length === 0) return;

        const headers = parsedRows[0];
        const rows = parsedRows.slice(1); // Tetap mempertahankan SELURUH 1700+ baris data

        state.allData = rows;
        state.filteredData = rows;

        renderHeader(headers);
        renderTable();
        renderChartKategori(rows); // Render grafik dengan konversi kapitalisasi khusus grafik
    } catch (error) {
        console.error("Gagal memuat data:", error);
        document.getElementById("dataInfo").textContent = "Gagal memuat data.";
    }
}

// 5. Render Grafik: Menggabungkan "Kirim ulang" ke "KIRIM ULANG" (Hanya untuk grafik)
function renderChartKategori(rows) {
    const kategoriCounts = {};

    rows.forEach(row => {
        let rawVal = row[INDEX_KATEGORI_PENANGANAN] ? row[INDEX_KATEGORI_PENANGANAN].trim() : "";

        if (!rawVal) return;

        // NORMALISASI GRAFIK: Jika terbaca "Kirim ulang" / "kirim ulang", gabungkan ke "KIRIM ULANG"
        if (rawVal.toLowerCase() === "kirim ulang") {
            rawVal = "KIRIM ULANG";
        }

        kategoriCounts[rawVal] = (kategoriCounts[rawVal] || 0) + 1;
    });

    const labels = Object.keys(kategoriCounts);
    const dataValues = Object.values(kategoriCounts);

    const ctx = document.getElementById('chartKategoriPenanganan').getContext('2d');

    if (chartInstance) {
        chartInstance.destroy();
    }

    chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels, // Hasilnya: REFUND, KIRIM ULANG, Belum Ditangani (tanpa batang kecil)
            datasets: [{
                label: 'Jumlah Order',
                data: dataValues,
                backgroundColor: '#e11d48',
                borderRadius: 4,
                barThickness: 50
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    grid: { color: '#f1f5f9' }
                },
                x: {
                    grid: { display: false },
                    ticks: {
                        font: { weight: '600' }
                    }
                }
            }
        }
    });
}

// 6. Fungsi Render Tabel & Paginasi Utuh
function renderHeader(headers) {
    const thead = document.querySelector("#dataTable thead");
    thead.innerHTML = "";
    const tr = document.createElement("tr");

    headers.forEach(headerText => {
        const th = document.createElement("th");
        th.textContent = headerText;
        tr.appendChild(th);
    });

    thead.appendChild(tr);
}

function renderTable() {
    const tbody = document.querySelector("#dataTable tbody");
    tbody.innerHTML = "";

    const startIdx = (state.currentPage - 1) * state.pageSize;
    const endIdx = startIdx + state.pageSize;
    const pageRows = state.filteredData.slice(startIdx, endIdx);

    pageRows.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cellValue => {
            const td = document.createElement("td");
            td.textContent = cellValue;
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    });

    updateSummaryInfo();
}

function updateSummaryInfo() {
    const infoContainer = document.getElementById("dataInfo");
    const totalData = state.filteredData.length;
    const totalPages = Math.ceil(totalData / state.pageSize) || 1;
    
    document.getElementById("btnPrev").disabled = state.currentPage <= 1;
    document.getElementById("btnNext").disabled = state.currentPage >= totalPages;

    if (infoContainer) {
        const startNum = totalData === 0 ? 0 : (state.currentPage - 1) * state.pageSize + 1;
        const endNum = Math.min(totalData, state.currentPage * state.pageSize);
        infoContainer.innerHTML = `Menampilkan ${startNum} - ${endNum} dari total <strong>${totalData}</strong> data (Halaman ${state.currentPage} dari ${totalPages})`;
    }
}

function changePage(newPage) {
    const totalPages = Math.ceil(state.filteredData.length / state.pageSize);
    if (newPage >= 1 && newPage <= totalPages) {
        state.currentPage = newPage;
        renderTable();
    }
}

document.addEventListener("DOMContentLoaded", fetchAndRenderData);
</script>

</body>
</html>

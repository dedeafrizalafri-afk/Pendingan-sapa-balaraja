<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Refund Dashboard SAPA BALARAJA</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="sidebar">

<h2>SAPA BALARAJA</h2>

<button id="btnDashboard" class="active">
📊 Dashboard
</button>

<button id="btnData">
📋 Data Pending
</button>

</div>

<div class="content">

<header>

<h1>Refund Dashboard SAPA BALARAJA</h1>

<p id="lastUpdate">
Last Update : -
</p>

</header>

<section id="dashboardPage">

<div class="cards">

<div class="card">
<h3>Total Pending</h3>
<h1 id="pending">0</h1>
</div>

<div class="card">
<h3>Total Refund</h3>
<h1 id="refund">0</h1>
</div>

<div class="card">
<h3>Total Qty</h3>
<h1 id="qty">0</h1>
</div>

<div class="card">
<h3>Total Toko</h3>
<h1 id="toko">0</h1>
</div>

</div>

<div class="chart-card">

<canvas id="myChart"></canvas>

</div>

</section>

<section id="dataPage" style="display:none;">

<div class="table-card">

<h2>Data Pending Refund</h2>

<div class="filter-box">

<div>

<label>Dari</label>

<input type="date" id="filterDari">

</div>

<div>

<label>Sampai</label>

<input type="date" id="filterSampai">

</div>

<div>

<label>Kode Toko</label>

<select id="filterToko">

<option value="">Semua</option>

</select>

</div>

<div>

<label>Status</label>

<select id="filterStatus">

<option value="">Semua</option>

<option value="PENDING">Pending</option>

<option value="REFUND">Refund</option>

<option value="KIRIM ULANG">Kirim Ulang</option>

</select>

</div>

<div>

<button id="btnFilter">
Filter
</button>

</div>

</div>

<input
type="text"
id="searchInput"
placeholder="Cari Order / Customer / Toko">

<div class="table-wrapper">

<table id="dataTable">

<thead>

<tr>

<th>Tanggal</th>
<th>Kode</th>
<th>Nama Toko</th>
<th>No Order</th>
<th>Customer</th>
<th>Qty</th>
<th>Status</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</div>

</div>

</section>

</div>

<script src="script.js"></script>

</body>
</html>
